<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enter access code · Kolmari</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/kolmari-favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="assets/kolmari-favicon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/kolmari-favicon-180.png" />
<meta name="theme-color" content="#0D1B39" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #0d1b39; -webkit-font-smoothing: antialiased; }
  ::selection { background: #f3c516; color: #17305b; }
  input::placeholder { color: #7a879c; }
</style>
</helmet>

<div style="font-family:Geist,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:380px;text-align:center">
    <img src="assets/kolmari-butterfly.png" alt="" width="34" height="25" style="display:block;width:34px;height:25px;object-fit:contain;margin:0 auto 18px" />
    <h1 style="margin:0;font-family:Poppins,sans-serif;font-weight:700;font-size:24px;color:#fff">Enter your access code</h1>
    <p style="margin:10px 0 0;font-size:14px;line-height:1.55;color:#b9c6dc">You should have gotten this from whoever sent you this link.</p>

    <div style="margin-top:26px;display:flex;flex-direction:column;gap:12px">
      <input value="{{ code }}" sc-camel-on-input="{{ setCode }}" sc-camel-on-key-down="{{ onKeyDown }}" type="text" placeholder="Access code" aria-label="Access code" autoComplete="off" style="font-family:inherit;font-size:16px;letter-spacing:.04em;text-align:center;color:#17305b;background:#fff;border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 15px;outline:none" style-focus="border-color:#f3c516;box-shadow:0 0 0 3px rgba(243,197,22,.25)" />
      <button sc-camel-on-click="{{ submit }}" style="font-family:inherit;font-size:15px;font-weight:700;color:#17305b;background:#f3c516;border:none;border-radius:999px;padding:14px 26px;cursor:pointer" style-hover="background:#ffd633">Continue</button>
    </div>

    <sc-if value="{{ showErr }}" hint-placeholder-val="{{ true }}">
      <p style="margin:16px 0 0;font-size:13px;color:#ff8a80">That code doesn't match. Double check and try again.</p>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { code: '', showErr: false };

  renderVals() {
    const s = this.state;
    const ACCESS_CODE = 'KOLMARI2026';

    const attempt = () => {
      if (s.code.trim().toUpperCase() === ACCESS_CODE) {
        try { localStorage.setItem('kolmari:access', '1'); } catch (e) {}
        window.location.href = 'app.html';
      } else {
        this.setState({ showErr: true });
      }
    };

    return {
      code: s.code,
      setCode: (e) => this.setState({ code: e.target.value, showErr: false }),
      onKeyDown: (e) => { if (e.key === 'Enter') attempt(); },
      submit: attempt,
      showErr: s.showErr,
    };
  }
}
</script>
</body>
</html>
